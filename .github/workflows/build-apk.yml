name: Build JustPlayHelper APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Instalar o Android SDK e as ferramentas de linha de comandos
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Verificar se o SDK está disponível
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não foi instalado corretamente."
            find "$ANDROID_HOME" -maxdepth 5 -type f \
              -name sdkmanager -print || true
            exit 1
          fi

          echo "SDK Manager encontrado: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version

      # Instalar os componentes necessários
      - name: Install SDK components
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # Localizar o projeto Android
      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          echo "Conteúdo do repositório:"
          ls -la

          WRAPPER=$(find . -maxdepth 7 -type f \
            -name gradlew \
            -not -path './.git/*' | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "::error::Não foi encontrado o ficheiro gradlew."
            echo "Verifica se o projeto Android está no repositório."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Falta settings.gradle ou settings.gradle.kts."
            exit 1
          fi

          echo "Projeto encontrado: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # Preparar Gradle
      - name: Prepare Gradle
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --version

      # Compilar a aplicação Android
      - name: Build APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      # Verificar o APK gerado
      - name: Verify APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::O APK não foi gerado."
            exit 1
          fi

          echo "APK gerado: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # Disponibilizar o APK para download
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JustPlayHelper-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 7
