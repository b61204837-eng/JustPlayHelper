    - name: Configurar o JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Configurar Gradle Estável
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9' # Garante compatibilidade estrita com AGP 8.7.3

    - name: Dar permissão de execução ao gradlew
      run: chmod +x gradlew

    - name: Compilar o APK (Debug)
      run: ./gradlew assembleDebug
