name: Build JustPlayHelper APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            cd /tmp
            curl -fL \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -o android-tools.zip

            mkdir -p android-tools
            unzip -q android-tools.zip -d android-tools

            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

            cp -a android-tools/cmdline-tools/. \
              "$ANDROID_HOME/cmdline-tools/latest/"
          fi

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses || true

      - name: Install SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "gradlew" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "app/gradlew" ]; then
            echo "dir=app" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Gradle wrapper not found."
            echo "The repository must contain gradlew."
            exit 1
          fi

      - name: Verify Gradle project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          if [ ! -f "settings.gradle" ] &&
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find . \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            ! -path "*/build/outputs/apk/androidTest/*" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/JustPlayHelper.apk

          echo "APK created successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JustPlayHelper-APK
          path: release/JustPlayHelper.apk
          if-no-files-found: error
          retention-days: 7
