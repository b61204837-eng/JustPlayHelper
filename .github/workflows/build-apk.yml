name: Build JustPlayHelper APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find Android project
        run: |
          echo "Repository files:"
          ls -la
          echo "Searching for Gradle files:"
          find . -maxdepth 5 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f gradlew.bat ]; then
            echo "Windows Gradle wrapper found; gradlew is missing."
            exit 1
          else
            echo "ERROR: gradlew not found in repository root."
            echo "Check the project location printed in the previous step."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JustPlayHelper-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
