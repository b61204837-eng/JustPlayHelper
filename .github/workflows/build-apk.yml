name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build JustPlayHelper APK
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5 # Atualizado para v5 para eliminar o aviso de obsolescência
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          echo "A verificar os ficheiros do projeto..."
          if [ ! -d "app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "ERRO: ficheiro settings.gradle.kts ou settings.gradle não encontrado."
            exit 1
          fi
          echo "Projeto Android encontrado."

      - name: Make Gradle Wrapper executable
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "AVISO: O Gradle Wrapper não existe no repositório. A gerar com o Gradle do sistema..."
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --no-build-cache assembleDebug -Pkotlin.jvm.target.validation.mode=warning

      - name: Verify and Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "ERRO: nenhum APK foi gerado."
            exit 1
          fi
          echo "APK gerado: $APK_PATH"
          mkdir -p release
          cp "$APK_PATH" release/JustPlayHelper.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JustPlayHelper-APK
          path: release/JustPlayHelper.apk
          if-no-files-found: error
          retention-days: 7
