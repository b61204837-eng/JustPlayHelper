name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # CORREÇÃO: Este passo força a criação do gradlew se ele não existir
    - name: Garantir que o Gradle Wrapper existe
      run: gradle wrapper

    - name: Dar permissão de execução ao gradlew
      run: chmod +x gradlew

    - name: Compilar o APK (Debug)
      run: ./gradlew assembleDebug
