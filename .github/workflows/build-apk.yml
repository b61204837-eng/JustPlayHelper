name: Build JustPlayHelper APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "./app/gradlew" ]; then
            echo "dir=app" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Gradle wrapper not found."
            echo "The repository must contain gradlew."
            exit 1
          fi

      - name: Verify Gradle wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x ./gradlew
          test -f gradlew
          test -f settings.gradle || test -f settings.gradle.kts

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find . -type f -path "*/build/outputs/apk/*/*.apk" \
            ! -path "*/build/outputs/apk/androidTest/*" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated: $APK"
          mkdir -p release
          cp "$APK" release/JustPlayHelper.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JustPlayHelper-APK
          path: release/JustPlayHelper.apk
          if-no-files-found: error
          retention-days: 7
