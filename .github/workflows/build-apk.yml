name: Build JustPlayHelper APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            echo "ERROR: Root Gradle build file not found."
            exit 1
          fi

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          if [ -f "gradlew" ]; then
            chmod +x gradlew
          elif [ -f "app/gradlew" ]; then
            cp app/gradlew ./gradlew
            chmod +x gradlew
          else
            echo "Gradle wrapper missing. Checking installed Gradle..."

            sudo apt-get update
            sudo apt-get install -y gradle

            gradle wrapper --gradle-version 8.9
            chmod +x gradlew
          fi

      - name: Build APK
        shell: bash
        run: |
          set -e
          ./gradlew --no-daemon assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk \
            -type f -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/JustPlayHelper.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JustPlayHelper-APK
          path: release/JustPlayHelper.apk
          if-no-files-found: error
          retention-days: 7
